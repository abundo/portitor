# Tests, lint and a release-build check on every push and pull request.
# Releases themselves are built by release.yml when a v* tag is pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The render tests run `nft -c`; they skip if nft is missing.
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal models web/*.go)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      # Without --fix (npm run lint fixes in place), so CI fails instead.
      - run: npx oxlint .
      - run: npx eslint .
      - run: npx prettier --check src/
      - run: npm run build

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      # Builds the archives exactly as a release would, without publishing.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
