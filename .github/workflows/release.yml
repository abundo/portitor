# Pushing a tag v* builds the release archives install.py installs from, and
# the installer ISO (amd64) from them.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: make test

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      # The release notes are the tag's section of CHANGELOG.md; a tag
      # without one fails here, before anything is published.
      - run: dev/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The installer ISO, built from the archive just published (so it holds
  # exactly the release's binaries) and attached to the same release.
  iso:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q xorriso
      - run: iso/build.sh --release "$GITHUB_REF_NAME" -o "build/portitor-$GITHUB_REF_NAME-amd64.iso"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      - name: Upload to the release
        run: |
          cd build
          iso=portitor-$GITHUB_REF_NAME-amd64.iso
          sha256sum "$iso" >"$iso.sha256"
          gh release upload "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --clobber -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
