# UEFI boot menu of the Portitor ISO (replaces Debian's /boot/grub/grub.cfg).
set default=0
set timeout=10

menuentry "Install Portitor" {
	linux /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/preseed.cfg --- quiet
	initrd /install.amd/initrd.gz
}
menuentry "Install Portitor (expert: ask what the preseed leaves open)" {
	linux /install.amd/vmlinuz priority=low preseed/file=/cdrom/preseed.cfg ---
	initrd /install.amd/initrd.gz
}
