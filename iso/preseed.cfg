# Debian 13 installer answers for the Portitor ISO. The installer still asks
# for the disk to install on and before erasing it, and for the network
# settings when there is no DHCP; nothing else. The installation downloads
# the packages, so it needs Internet access.

d-i debian-installer/locale string en_US.UTF-8
# The first-boot setup asks for the keyboard layout.
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string portitor
d-i netcfg/get_domain string lan
d-i netcfg/hostname string portitor
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# No root login; the user portitor has sudo. Its password is locked until
# the first-boot setup sets it.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Portitor
d-i passwd/username string portitor
d-i passwd/user-password-crypted password !

# The first-boot setup asks for the time zone.
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# One partition on the disk the installer asks for; it asks before writing.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

tasksel tasksel/first multiselect
# tshark asks whether non-root users may capture; they may not.
wireshark-common wireshark-common/install-setuid boolean false
d-i pkgsel/include string nftables iproute2 wireguard-tools bind9 bind9-utils bind9-dnsutils kea-dhcp4-server kea-dhcp6-server radvd python3 python3-textual openssl sudo console-setup ca-certificates iputils-ping tcpdump tshark less qemu-guest-agent
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string sh /cdrom/portitor/late.sh

d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
