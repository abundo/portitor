# Debian 13 installer answers for the Portitor ISO. The installer still asks
# for the disk to install on and before erasing it; nothing else. It needs no
# network: the base system is the netinst ISO's, and the packages are the ISO's
# own repository (/portitor/repo, installed by target.sh from late_command,
# not by pkgsel), so nothing is upgraded or fetched either.

d-i debian-installer/locale string en_US.UTF-8
# The first-boot setup asks for the keyboard layout.
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string portitor
d-i netcfg/get_domain string lan
d-i netcfg/hostname string portitor
d-i hw-detect/load_firmware boolean true

# No network mirror: the sources of the installed system are written by
# target.sh.
d-i apt-setup/use_mirror boolean false

# No root login; the user portitor has sudo. Its password is locked until
# the first-boot setup sets it.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Portitor
d-i passwd/username string portitor
d-i passwd/user-password-crypted password !

# The first-boot setup asks for the time zone.
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false

# One partition on the disk the installer asks for; it asks before writing.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-efi/non_efi_system boolean true

d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
# BIND 9 stable comes from ISC's Debian repository
# (https://kb.isc.org/docs/isc-packages-for-bind-9), newer than Debian's: it is
# in the ISO's repository (iso/build.sh), and target.sh writes its apt source.

tasksel tasksel/first multiselect
# tshark asks whether non-root users may capture; portitor-setup allows the
# wireshark group and adds the console user to it.
wireshark-common wireshark-common/install-setuid boolean false
# iperf3 runs from Tools → iperf3 only, never as its own daemon.
iperf3 iperf3/start_daemon boolean false
# No Recommends (no X11 or desktop libraries); also written to the installed
# system as /etc/apt/apt.conf.d/00InstallRecommends. So systemd's Recommends are
# listed: dbus (timedatectl, hostnamectl), libpam-systemd; chrony keeps the time (systemd-timesyncd's place).
d-i base-installer/install-recommends boolean false
# The packages are iso/packages.txt, installed by target.sh.
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string sh /cdrom/portitor/late.sh

d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
