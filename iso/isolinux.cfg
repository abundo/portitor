# BIOS boot menu of the Portitor ISO (replaces Debian's isolinux.cfg).
default install
prompt 1
timeout 100
display portitor.txt

label install
	kernel /install.amd/vmlinuz
	append initrd=/install.amd/initrd.gz auto=true priority=high preseed/file=/cdrom/preseed.cfg vga=788 --- quiet

label expert
	kernel /install.amd/vmlinuz
	append initrd=/install.amd/initrd.gz priority=low preseed/file=/cdrom/preseed.cfg vga=788 ---
