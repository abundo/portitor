# The "ISP": DHCP and DNS for the firewall's WAN (eth0 on fw, wan0 here).
interface=wan0
bind-dynamic
no-hosts
dhcp-range=198.51.100.100,198.51.100.200,255.255.255.0,1h
dhcp-option=option:router,198.51.100.1
dhcp-option=option:dns-server,198.51.100.1
dhcp-authoritative
log-dhcp
