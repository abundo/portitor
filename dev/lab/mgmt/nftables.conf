# The "ISP": NAT the firewall's WAN out through the container's own uplink.
flush ruleset
table ip lab {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 198.51.100.0/24 oifname "eth0" masquerade
	}
}
