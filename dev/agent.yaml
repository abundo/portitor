# Development config: `make dev-agent`. Dry-run: renders and logs commands,
# changes nothing on this machine. Files go under dev/run/.
listen: 127.0.0.1:8443
token_file: dev/run/agent.token
tls_cert: dev/run/agent.crt
tls_key: dev/run/agent.key
allow_from: [127.0.0.0/8, "::1/128"]
dry_run: true
paths:
  etc_dir: dev/run/etc
  state_dir: dev/run/state
  run_dir: dev/run/run
  kea_data_dir: dev/run/kea
  kea_socket_dir: dev/run/kea
  bind_cache_dir: dev/run/bind/cache
  bind_zones_dir: dev/run/bind/zones
  bind_run_dir: dev/run/bind/run
