# /etc/portitor/config.yaml - portitor-config: the firewall's configuration,
# its database, GUI and API, on the firewall itself, deploying to its own
# agent (and its HA secondary's). portitor-web elsewhere serves its GUI too.
bind: ":8444"
jwt_secret: CHANGE-ME
db:
  path: /var/lib/portitor-config/portitor.db
# portitor-web and the HA peer pin this certificate (portitor-config
# fingerprint), whatever certificate the GUI is given under Settings.
tls_cert: /etc/portitor/config.crt
tls_key: /etc/portitor/config.key
# portitor-web's address: it passes the browser's on in X-Forwarded-For,
# which the login limits count.
trusted_proxies: []
# This host's agent, which tells portitor-config its place in an HA pair.
# agent_url: https://127.0.0.1:8443
