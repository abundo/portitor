# /etc/portitor/agent.yaml - portitor-agent (runs on the firewall, as root).
# Create the token and certificate with:
#   portitor-agent init --host <management address>

# Management API. Bind to the management (LAN) address, never the WAN.
listen: 192.168.1.1:8443
token_file: /etc/portitor/agent.token
tls_cert: /etc/portitor/agent.crt
tls_key: /etc/portitor/agent.key

# Who may call the API. The same list gets an always-on accept rule for the
# API port and SSH (22) (anti-lockout), whatever rules are deployed.
allow_from:
  - 192.168.1.0/24

# anti_lockout: true
# bind_user: bind          # BIND's user: bind (Debian) or named (Fedora)
# console_user: portitor  # the web console's shell and command tasks run as this user; none = off
# dry_run: false           # render and log only; writes only its own state_dir
# log_level: info

