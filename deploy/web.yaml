# /etc/portitor/web.yaml - portitor-web (runs off the firewall).

# Put a TLS reverse proxy in front, or set tls_cert/tls_key, or
# tls_certificate: a certificate from Services -> Certificates, fetched from the
# agent and reloaded when renewed.
bind: 127.0.0.1:8080
# tls_cert: /etc/portitor/web.crt
# tls_key: /etc/portitor/web.key
# tls_certificate: main/web     # <instance>/<certificate name>

# Signs session cookies. At least 32 random characters:
#   openssl rand -base64 32
jwt_secret: CHANGE-ME

# SQLite database file. The unit's StateDirectory creates its directory.
db:
  path: /var/lib/portitor-web/portitor.db

# Wiregasm (Wireshark in WebAssembly) for the packet capture viewer, a separate
# program that install.py downloads here.
# wiregasm_dir: /usr/share/portitor/wiregasm
