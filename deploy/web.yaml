# /etc/portitor/web.yaml - portitor-web: the portal to the firewalls' GUIs.
# It has no database: each firewall keeps its configuration in its own
# portitor-config, which portitor-web serves at /fw/<name>/ (with its login,
# users and roles). Put a TLS reverse proxy in front, or set tls_cert/tls_key.
bind: 127.0.0.1:8080
# tls_cert: /etc/portitor/web.crt
# tls_key: /etc/portitor/web.key

# The firewalls: each one's portitor-config URL and the SHA-256 of its
# tls_cert (portitor-config fingerprint, on that firewall). There, list this
# host's address under trusted_proxies in /etc/portitor/config.yaml.
firewalls: []
#  - name: fw1
#    url: https://192.0.2.1:8444
#    fingerprint: 0123...ef

# The HA pairs this host is the witness of (their third vote): the witness
# string of each (portitor-config witness-string on the pair's primary, its
# HA witness set to external). `portitor-web witness` runs the witness alone.
witness: []
